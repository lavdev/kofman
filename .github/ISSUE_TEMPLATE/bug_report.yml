name: Bug report
description: Relate um comportamento inesperado.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Liste os passos mínimos para reproduzir o problema.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Informe sistema operacional, versão do Kof e comando usado.
    validations:
      required: true
